        warn: "全店都是單人吧台座位，沒有兒童座椅也不適合多人聚餐聊天；建議免費加麵才吃得飽。"
      }

    let restaurants = JSON.parse(localStorage.getItem('honestFoodCards_v3')) || [...defaultRestaurants];
    let mode = 'home';
    let currentPlayer = 1;
    let p1Likes = [];
    let p2Likes = [];
    let filteredDeck = [];
    let currentIndex = 0;
    let selectedTag = 'ALL';
    let userLocation = null;

    const app = document.getElementById('app');

    // Haversine formula to calculate distance in km
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function requestGPS() {
      const btn = document.getElementById('gpsBtn');
      if (!navigator.geolocation) {
        alert('你的瀏覽器不支援 GPS 定位功能喔！');
        return;
      }
      if (btn) btn.innerHTML = '⏳ 正在取得你的 GPS 位置...';

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation = {
            lat: pos.coords.latitude,
            lng: pos.coords.longitude
          };
          // Calculate distance & sort nearest first
          restaurants.forEach(r => {
            if (r.lat && r.lng) {
              const km = getDistanceKm(userLocation.lat, userLocation.lng, r.lat, r.lng);
              r.distanceKm = km;
              const meters = Math.round(km * 1000);
              const rideMin = Math.max(1, Math.round(km * 2.5));
              r.liveDistText = meters < 1000
                ? `距離你 ${meters} 公尺（約 ${rideMin} 分鐘）`
                : `距離你 ${km.toFixed(1)} 公里（車程約 ${rideMin} 分鐘）`;
            }
          });
          restaurants.sort((a, b) => (a.distanceKm || 999) - (b.distanceKm || 999));
          render();
        },
        (err) => {
          alert('無法取得定位（請確認瀏覽器已允許位置權限），將繼續使用預設距離顯示！');
          if (btn) btn.innerHTML = '📍 開啟定位，自動計算真實距離';
        },
        { enableHighAccuracy: true, timeout: 8000 }
      );
    }

    function render() {
      if (mode === 'home') {
        renderHome();
      } else {
        renderSwipeScreen();
      }
    }

    function renderHome() {
      const tags = ['ALL', '午休快速吃', '聚餐約會親子', '高CP值日常餐', '深夜宵夜救星'];
      const tagLabels = {
        'ALL': '🔥 全部實測 (' + restaurants.length + ')',
        '午休快速吃': '⏱️ 午休快速吃',
        '聚餐約會親子': '👨‍👩‍👧‍👦 約會／親子',
        '高CP值日常餐': '💰 高CP日常餐',
        '深夜宵夜救星': '🌙 深夜宵夜'
      };

      app.innerHTML = `

            <div class="inline-flex items-center gap-1.5 bg-orange-50 text-orange-600 text-xs font-bold px-3 py-1 rounded-full">
              <span>🚫 拒絕網美業配</span>
              <span>•</span>
              <span>專治「隨便」選擇障礙</span>
            </div>
          </div>
          <h2 class="text-2xl font-black text-slate-800 leading-snug mb-2">
            別再問「這餐吃什麼」<br/>滑出你們的<span class="text-orange-500">命定無雷餐廳</span>
          </h2>
          <p class="text-xs text-slate-500 leading-relaxed mb-4">
            不論是情侶約會、同事午休或家庭聚餐，每張卡片都附上<strong class="text-emerald-600">「老饕必點」</strong>與超誠實的<strong class="text-rose-500">「勸退指南（不適合誰）」</strong>。
          </p>

          <!-- GPS Button -->
          <button id="gpsBtn" onclick="requestGPS()" class="w-full mb-4 py-2.5 px-3 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 transition ${
            userLocation
              ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
              : 'bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200'
          }">
            ${userLocation ? '✅ 已開啟 GPS 定位（已依距離由近到遠排序）' : '📍 開啟定位，自動計算離你多遠＆由近到遠排序'}
          </button>

          <div class="mb-5">
            <label class="block text-xs font-bold text-slate-400 mb-2">1. 選擇今天用餐情境：</label>
            <div class="flex flex-wrap gap-1.5">
              ${tags.map(t => `
                <button onclick="selectTag('${t}')" class="text-xs font-bold px-3 py-1.5 rounded-full transition ${
                  selectedTag === t
                    ? 'bg-slate-800 text-white shadow-sm'
                    : 'bg-slate-100 text-slate-600 hover:bg-slate-200'
                }">
                  ${tagLabels[t]}

              `).join('')}
            </div>
          </div>

          <div class="space-y-2.5">
            <label class="block text-xs font-bold text-slate-400">2. 選擇決策模式：</label>
            <button onclick="startMode('duo')" class="w-full py-3.5 px-4 rounded-2xl bg-gradient-to-r from-orange-500 to-rose-500 text-white font-bold text-left flex items-center justify-between shadow-lg shadow-orange-200 hover:opacity-95 transition active:scale-[0.98]">
              <div>
                <div class="text-base font-black flex items-center gap-1.5">
                  👫 雙人／同行滑卡配對
                  <span class="text-[10px] bg-white/25 px-2 py-0.5 rounded-full">主打功能</span>
                </div>
                <div class="text-xs text-orange-100 font-normal mt-0.5">伴侶、同事或家人輪流滑，都按 ❤️ 立刻配對成功！</div>
              </div>
              <span class="text-xl">➔</span>
            </button>

            <button onclick="startMode('solo')" class="w-full py-3.5 px-4 rounded-2xl bg-white border-2 border-slate-200 hover:border-orange-300 text-slate-700 font-bold text-left flex items-center justify-between transition active:scale-[0.98]">
              <div>
                <div class="text-sm font-black">🙋 單人快速選餐模式</div>
                <div class="text-xs text-slate-400 font-normal mt-0.5">自己滑出想吃的口袋名單，一鍵幫你抽最終決定</div>
              </div>
              <span class="text-lg text-slate-400">➔</span>
            </button>
          </div>
        </div>
      `;
    }

    function selectTag(tag) {
      selectedTag = tag;
      render();
    }

    function startMode(selectedMode) {
      filteredDeck = selectedTag === 'ALL'
        ? [...restaurants]
        : restaurants.filter(r => r.tag === selectedTag);

      if (filteredDeck.length === 0) {
        alert('這個分類目前沒有卡片，請先選「全部實測」或自己新增一間吧！');
        return;
      }

      mode = selectedMode;
      currentPlayer = 1;
      p1Likes = [];
      p2Likes = [];
      currentIndex = 0;
      render();
    }

    function goHome() {
      mode = 'home';
      render();
    }

    function renderSwipeScreen() {
      if (currentIndex >= filteredDeck.length) {
        if (mode === 'duo' && currentPlayer === 1) {
          app.innerHTML = `
            <div class="bg-white rounded-3xl p-7 text-center card-shadow pop-in border border-orange-100">
              <div class="text-5xl mb-3">📱</div>
              <h2 class="text-xl font-black text-slate-800 mb-2">第一位滑完了！</h2>
              <p class="text-sm text-slate-500 mb-6 leading-relaxed">
                你一共按了 <strong class="text-orange-600">${p1Likes.length}</strong> 間喜歡！<br/>
                現在請把手機交給<strong>第二位（伴侶、同事或家人）</strong>，只要他也對同一間按喜歡，就會立刻配對成功！
              </p>
              <button onclick="startPlayer2()" class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-orange-500 to-rose-500 text-white font-black text-base shadow-lg hover:opacity-95 transition">
                我是第二位，開始滑卡！
              </button>
            </div>
          `;
          return;
        } else {
          const likesPool = mode === 'solo' ? p1Likes : [...new Set([...p1Likes, ...p2Likes])];
          const randomPick = likesPool.length > 0
            ? likesPool[Math.floor(Math.random() * likesPool.length)]
            : filteredDeck[Math.floor(Math.random() * filteredDeck.length)];

          app.innerHTML = `
            <div class="bg-white rounded-3xl p-6 text-center card-shadow pop-in border border-orange-100">
              <div class="text-4xl mb-2">${mode === 'duo' ? '😅' : '🎯'}</div>
              <h2 class="text-xl font-black text-slate-800 mb-1">
                ${mode === 'duo' ? '哎呀！你們居然沒有重疊的愛店' : '你的專屬口袋名單出爐！'}
              </h2>
              <p class="text-xs text-slate-500 mb-4">
                ${mode === 'duo' ? '沒關係，系統從你們各自喜歡的店裡隨機幫你們抽一間！' : '從你剛剛按喜歡的店裡，幫你抽出這餐的最終贏家：'}
              </p>
              <div class="bg-orange-50 rounded-2xl p-4 text-left border border-orange-200 mb-5">
                <div class="flex items-center justify-between mb-1">
                  <span class="text-xs font-bold text-orange-600 bg-white px-2 py-0.5 rounded-full">${randomPick.tag}</span>
                  <span class="text-xs font-bold text-slate-500">${randomPick.price}</span>
                </div>
                <h3 class="text-lg font-black text-slate-800 mb-2">${randomPick.emoji} ${randomPick.name}</h3>
                <p class="text-xs text-emerald-700 mb-1.5"><strong>👍 必點：</strong>${randomPick.must}</p>
                <p class="text-xs text-rose-600"><strong>⚠️ 誠實勸退：</strong>${randomPick.warn}</p>
              </div>
              <div class="flex gap-2">
                <button onclick="goHome()" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-700 font-bold text-sm">回首頁重選</button>
                <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('台中 ' + randomPick.name)}" target="_blank" class="flex-1 py-3 rounded-xl bg-orange-500 text-white font-bold text-sm shadow">📍 查地圖出發</a>
              </div>
            </div>
          `;
          return;
        }
      }

      const card = filteredDeck[currentIndex];
      const progress = `${currentIndex + 1} / ${filteredDeck.length}`;
      const displayDist = card.liveDistText ? card.liveDistText : card.dist;

      app.innerHTML = `
        <div class="flex flex-col h-full justify-between">
          <div class="flex items-center justify-between mb-3">
            <button onclick="goHome()" class="text-xs font-bold text-slate-500 hover:text-slate-800 flex items-center gap-1">
              ← 換情境
            </button>
            <div class="px-3 py-1 rounded-full text-xs font-black ${
              mode === 'duo'
                ? (currentPlayer === 1 ? 'bg-orange-100 text-orange-700' : 'bg-rose-100 text-rose-700')
                : 'bg-slate-200 text-slate-700'
            }">
              ${mode === 'duo' ? `👤 第 ${currentPlayer} 位選擇中` : '🙋 單人挑選中'}
            </div>
            <span class="text-xs font-bold text-slate-400">${progress}</span>
          </div>

          <div id="activeCard" class="swipe-card bg-white rounded-3xl overflow-hidden card-shadow border border-slate-100 flex flex-col">
            <div class="bg-gradient-to-br ${card.bg} p-5 text-white relative">
              <div class="flex justify-between items-start">
                <span class="bg-black/20 text-white text-xs font-bold px-3 py-1 rounded-full">
                  ${card.tag}
                </span>
                <span class="text-4xl drop-shadow">${card.emoji}</span>
              </div>
              <h2 class="text-xl font-black mt-3 leading-snug tracking-tight">${card.name}</h2>
              <div class="flex items-center gap-3 mt-2 text-xs font-medium text-white/90">
                <span>💰 ${card.price}</span>
                <span>•</span>
                <span>📍 ${displayDist}</span>
              </div>
            </div>

            <div class="p-5 space-y-3.5 bg-white flex-1">
              <div class="bg-emerald-50/80 border border-emerald-100 rounded-2xl p-3.5">
                <div class="text-xs font-black text-emerald-700 mb-1 flex items-center gap-1">
                  <span>👍 老饕私房必點</span>
                </div>
                <p class="text-xs text-slate-700 leading-relaxed">${card.must}</p>
              </div>

              <div class="bg-rose-50/80 border border-rose-100 rounded-2xl p-3.5">
                <div class="text-xs font-black text-rose-600 mb-1 flex items-center gap-1">
                  <span>⚠️ 誠實勸退指南（不適合誰？）</span>
                </div>
                <p class="text-xs text-slate-700 leading-relaxed">${card.warn}</p>
              </div>
            </div>
          </div>

          <div class="flex items-center justify-center gap-6 mt-5 mb-2">
            <button onclick="handleDecision(false)" class="w-16 h-16 rounded-full bg-white shadow-lg border border-slate-100 flex items-center justify-center text-2xl text-slate-400 hover:text-slate-600 hover:scale-105 active:scale-95 transition" title="先不要">
              ✖️
            </button>
            <button onclick="handleDecision(true)" class="w-16 h-16 rounded-full bg-gradient-to-tr from-orange-500 to-rose-500 shadow-lg shadow-orange-200 flex items-center justify-center text-2xl text-white hover:scale-105 active:scale-95 transition" title="想吃這間！">
              ❤️
            </button>
          </div>
          <p class="text-center text-[11px] text-slate-400">左右滑動卡片，或點擊下方按鈕決定</p>
        </div>
      `;

      setupTouchSwipe();
    }

    function startPlayer2() {
      currentPlayer = 2;
      currentIndex = 0;
      render();
    }

    function handleDecision(liked) {
      const cardEl = document.getElementById('activeCard');
      const currentCard = filteredDeck[currentIndex];

      if (cardEl) {
        cardEl.style.transform = liked ? 'translateX(120%) rotate(15deg)' : 'translateX(-120%) rotate(-15deg)';
        cardEl.style.opacity = '0';
      }

      setTimeout(() => {
        if (liked) {
          if (mode === 'solo') {
            p1Likes.push(currentCard);
          } else if (currentPlayer === 1) {
            p1Likes.push(currentCard);
          } else {
            p2Likes.push(currentCard);
            if (p1Likes.some(item => item.id === currentCard.id)) {
              showMatchModal(currentCard);
            }
          }
        }
        currentIndex++;
        render();
      }, 220);
    }

    function setupTouchSwipe() {
      const card = document.getElementById('activeCard');
      if (!card) return;
      let startX = 0;
      let currentX = 0;

      card.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        card.classList.add('dragging');
      });

      card.addEventListener('touchmove', (e) => {
        currentX = e.touches[0].clientX - startX;
        card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
      });

      card.addEventListener('touchend', () => {
        card.classList.remove('dragging');
        if (currentX > 90) {
          handleDecision(true);
        } else if (currentX < -90) {
          handleDecision(false);
        } else {
          card.style.transform = 'translateX(0) rotate(0)';
        }
        currentX = 0;
      });
    }

    function showMatchModal(card) {
      const modal = document.getElementById('matchModal');
      const content = document.getElementById('matchCardContent');
      const mapLink = document.getElementById('matchMapLink');

      content.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs font-bold text-orange-600 bg-white px-2 py-0.5 rounded-full">${card.tag}</span>
          <span class="text-xs font-bold text-slate-500">${card.price}</span>
        </div>
        <h3 class="text-lg font-black text-slate-800 mb-2">${card.emoji} ${card.name}</h3>
        <p class="text-xs text-emerald-700 mb-1.5"><strong>👍 必點：</strong>${card.must}</p>
        <p class="text-xs text-rose-600"><strong>⚠️ 誠實勸退：</strong>${card.warn}</p>
      `;
      mapLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('台中 ' + card.name)}`;
      modal.classList.remove('hidden');
    }

    function closeMatchModal() {
      document.getElementById('matchModal').classList.add('hidden');
    }

    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
    }

    function handleAddRestaurant(e) {
      e.preventDefault();
      const newRest = {
        id: Date.now(),
        name: document.getElementById('newName').value.trim(),
        price: document.getElementById('newPrice').value.trim(),
        dist: document.getElementById('newDist').value.trim(),
        tag: document.getElementById('newTag').value,
        emoji: "🍽️",
        bg: "from-orange-500 to-rose-500",
        must: document.getElementById('newMust').value.trim(),
        warn: document.getElementById('newWarn').value.trim()
      };
      restaurants.unshift(newRest);
      localStorage.setItem('honestFoodCards_v3', JSON.stringify(restaurants));
      document.getElementById('addForm').reset();
      closeAddModal();
      alert('✅ 已成功新增到你的探店資料庫！');
      render();
    }

    function openFeedbackModal() {
      document.getElementById('feedbackModal').classList.remove('hidden');
    }

    function closeFeedbackModal() {
      document.getElementById('feedbackModal').classList.add('hidden');
    }

    function submitFakeFeedback() {
      closeFeedbackModal();
      alert('🎉 感謝你的試用回饋！\n（提示：正式推廣時，這裡可以連到你的 Google 表單來收集真實名單數據喔！）');
    }

    // Init
    render();
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    });
  }
</script>
  
</body>
</html>
